name: Saucedemo UI Automation CI

on:
  push:
    branches: [ main ]
    paths:
      - '01-saucedemo-ui-framwwork/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r 01-saucedemo-ui-framework/requirements.txt

    - name: Run Pytest Headless
      run: |
        cd 01-saucedemo-ui-framework
        python -m pytest
